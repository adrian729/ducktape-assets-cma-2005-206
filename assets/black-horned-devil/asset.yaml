# descriptive: find it and understand it
id: black-horned-devil
title: Running black devil looking back
description: A slender black devil with two straight horns and pointed ears strides to the right on long legs while its head turns back to the left in profile. The body, limbs and face are drawn in fine gold hatching over black; one arm is bent before the chest, the other stretched back, and a thin curved tail hangs between the legs. The feet end in claws. Cut from the recto roundel; the background is transparent.
