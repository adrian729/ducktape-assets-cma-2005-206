# descriptive: find it and understand it
id: human-headed-bird-with-gold-neck
title: Lying bird with a bearded man's head
description: A grotesque bird lying with its brown body and pointed tail stretched to the right and a long gold neck curving up and over to the left, ending in a pale bearded man's head that hangs face down. The folded wing carries rows of yellow-gold spots and the gold neck is shaded with brown. Cut from the lower margin of the verso border; the background is transparent.
