# descriptive: find it and understand it
id: human-headed-bird
title: Walking bird with a bearded man's head
description: A grotesque bird walking to the right on two thin legs with spread claws. Its brown body carries a folded wing dotted with rows of yellow-gold spots, a pointed tail of three feathers to the left and a long curved neck ending in a pale bearded man's head with short brown hair, turned slightly towards the viewer. Cut from the lower margin of the recto border; the background is transparent.
