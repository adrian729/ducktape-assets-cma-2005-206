# descriptive: find it and understand it
id: discs-and-diamonds-line-filler
title: Discs and diamonds line filler, eight motifs
description: A finite horizontal line filler from the verso, a burnished gold bar with a black outline carrying eight motifs that alternate blue and brown, each with fine gold hatching, from left to right a blue diamond, brown disc, blue diamond, brown disc, blue disc, brown disc, blue diamond and brown diamond. Only the painted bar is opaque; the background is transparent.
