# descriptive: find it and understand it
id: two-dancing-devils-roundel
title: Two dancing devils, roundel
description: The whole round miniature from the verso. Two black horned devils with fine gold hatching dance side by side facing right, the left one with hands clasped before the chest, the right one with one arm thrown out and a leg kicked up, their clawed feet meeting at the bottom. They stand on a yellow-green hillside with blue-green trees under a blue sky that carries a short white inscription and two gold streaks. A thin gold rim closes the scene. Opaque inside the rim, transparent outside.
