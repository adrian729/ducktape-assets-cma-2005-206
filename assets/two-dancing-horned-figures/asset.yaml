id: two-dancing-horned-figures
title: Two dancing black devils
description: Two black devils with straight horns and pointed ears dance side by side facing right, drawn in fine gold hatching over black. The left one holds its clawed hands before its chest and steps forward; the right one throws one arm out to the right and lifts a bent leg, its other foot overlapping the first devil's foot so the pair forms one piece. Cut from the verso roundel; the background is transparent.
