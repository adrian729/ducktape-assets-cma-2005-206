# descriptive: find it and understand it
id: discs-and-three-diamonds-line-filler
title: Discs and diamonds line filler, ten motifs
description: A finite horizontal line filler from the recto, a burnished gold bar with a black outline carrying ten motifs that alternate blue and brown, each with fine gold hatching, from left to right a blue disc, brown disc, blue disc, brown diamond, blue diamond, brown diamond, blue disc, brown disc, blue disc and brown diamond. The bar is slightly thicker at the left end than at the right. Only the painted bar is opaque; the background is transparent.
