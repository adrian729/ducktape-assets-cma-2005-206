# descriptive: find it and understand it
id: gold-foliate-wave-line-filler
title: Acanthus wave line filler
description: A short finite horizontal line filler from the recto, a burnished gold bar with a black outline in which two curling acanthus leaves lie end to end in a wave, a brown and gold leaf on the left and a blue and gold leaf on the right, their lobes drawn in black line over gold. Only the painted bar is opaque; the background is transparent.
