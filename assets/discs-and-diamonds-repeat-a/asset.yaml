# descriptive: find it and understand it
id: discs-and-diamonds-repeat-a
title: Discs and diamonds on gold, recto repeat tile
description: One six-motif cycle of the recto line fillers, a burnished gold band between two black rules carrying, from left to right, a brown disc, blue disc, brown diamond, blue diamond, brown diamond and blue disc, each with fine gold hatching. The pattern continues across the left and right edges. Only the painted band is opaque; the thin strips above and below it are transparent.
