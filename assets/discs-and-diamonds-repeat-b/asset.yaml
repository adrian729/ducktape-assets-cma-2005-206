# descriptive: find it and understand it
id: discs-and-diamonds-repeat-b
title: Discs and diamonds on gold, verso repeat tile
description: One six-motif cycle of the verso line fillers, a burnished gold band between two black rules carrying a brown diamond split across the join, then a blue disc, brown disc, blue disc, brown disc and blue diamond, each with fine gold hatching. The pattern continues across the left and right edges. Only the painted band is opaque; the thin strips above and below it are transparent.
