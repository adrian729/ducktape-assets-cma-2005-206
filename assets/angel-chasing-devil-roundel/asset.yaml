# descriptive: find it and understand it
id: angel-chasing-devil-roundel
title: Angel chasing a devil, roundel
description: The whole round miniature from the recto. A white-robed angel with a pale gold halo and dark red wings strides to the right holding a long thin gold staff diagonally, one hand reaching towards a black horned devil who runs off to the right while looking back at the angel; the devil is painted black with fine gold hatching. They stand on a yellow-green hillside with blue-green trees under a blue sky with a few gold streaks. A thin gold rim closes the scene. Opaque inside the rim, transparent outside.
