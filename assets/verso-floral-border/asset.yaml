# descriptive: find it and understand it
id: verso-floral-border
title: Recto floral page border with empty roundel
description: The complete painted border of the recto, a dense field of hairline tendrils with gold dots, green and yellow leaves, red and blue flowers and red fruits, with large blue and gold acanthus scrolls at the top centre, the upper right and both lower corners. A human-headed bird walks in the lower margin. The text block is framed by a thin brown and gold rule with a blue and a red finial at its upper corners; a thin gold ring at the right is the empty seat of the removed roundel. The text block, the ring's interior and the parchment between the sprigs are transparent.
