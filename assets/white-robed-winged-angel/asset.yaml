id: white-robed-winged-angel
title: Angel with a gold staff
description: An angel in a long white robe stands turned to the right, head in three-quarter view with fair hair and a halo kept only as a thin gold line, two long dark red wings with gold speckling rising behind the shoulders. A thin gold staff with a small knob runs diagonally from the upper left across the body to the lower right; the right hand is raised before the chest and the left arm reaches forward. Cut from the recto roundel; the background is transparent.
