# descriptive: find it and understand it
id: recto-floral-border
title: Verso floral page border with devils roundel
description: The complete painted border of the verso, a dense field of hairline tendrils with gold dots, green and yellow leaves, blue and red flowers and red fruits, with large blue and gold acanthus scrolls in the four corners and along the top. The round miniature of two dancing black devils in a landscape sits in the left margin and a human-headed bird with a gold neck lies in the lower margin. The text block is framed by a thin brown and gold rule with a blue finial at each upper corner. The text block is transparent; the parchment between the sprigs is kept at partial opacity.
